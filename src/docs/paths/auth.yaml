register:
  post:
    tags: [Auth]
    summary: Create a new account
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/RegisterRequest"
    responses:
      201:
        description: User Created
      409:
        description: Email already exists

login:
  post:
    tags: [Auth]
    summary: Login to account
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/LoginRequest"
    responses:
      200:
        description: Login successfully
      401:
        description: Invalid credentials

refresh:
  post:
    tags: [Auth]
    summary: Refresh access token
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              refreshToken:
                type: string
    responses:
      200:
        description: Token refreshed
      401:
        description: Invalid refresh token

updateMe:
  patch:
    tags: [Auth]
    summary: Update current user profile
    security:
      - bearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/UpdateMeRequest"
    responses:
      200:
        description: Profile updated
      401:
        description: Unauthorized

updatePassword:
  patch:
    tags: [Auth]
    summary: Change user password
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/ChangePasswordRequest"
    responses:
      200:
        description: Password updated
      400:
        description: Invalid current password
